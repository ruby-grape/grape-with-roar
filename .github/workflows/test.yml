name: Tests
on:
  push:
    branches: [with-activerecord]
  pull_request:
    branches: [with-activerecord]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: password
          POSTGRES_DB: acme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d acme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.3', grape: '~> 2.4', rack: '~> 2.2' }
          - { ruby: '3.3', grape: '~> 2.4', rack: '~> 3.0' }
          - { ruby: '3.3', grape: '~> 3.0', rack: '~> 3.0' }
          - { ruby: '3.4', grape: '~> 4.0', rack: '~> 3.0' }
          - { ruby: '4.0', grape: '~> 4.0', rack: '~> 3.0' }
    name: Ruby ${{ matrix.entry.ruby }} / Grape ${{ matrix.entry.grape }} / Rack ${{ matrix.entry.rack }}
    env:
      RACK_ENV: test
      DATABASE_URL: postgresql://test:password@localhost:5432/acme_test
      GRAPE_VERSION: ${{ matrix.entry.grape }}
      RACK_VERSION: ${{ matrix.entry.rack }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the selected versions instead of the application lockfile
        run: rm Gemfile.lock
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - run: bundle exec rake db:create db:migrate spec
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          flag-name: ruby-${{ matrix.entry.ruby }}-${{ strategy.job-index }}
          parallel: true
  finish:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
